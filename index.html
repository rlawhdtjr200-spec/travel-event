<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>귀여운 여행 초대장 ✈️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');
        
        body {
            font-family: 'Gowun Dodum', sans-serif;
            background-color: #fff0f5;
            color: #333;
            margin: 0;
            min-height: 100vh; /* 화면 크기에 꽉 차도록 변경 */
            display: flex;
            justify-content: center;
            align-items: center;
            /* overflow: hidden; 삭제하여 모바일 스크롤 허용 */
            padding: 20px 0; /* 모바일에서 위아래 여백 추가 */
            box-sizing: border-box;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: white;
            padding: 30px 20px; /* 모바일 맞춤 패딩 축소 */
            border-radius: 30px;
            box-shadow: 0 15px 30px rgba(255,107,129,0.1);
            max-width: 500px;
            width: 90%;
            border: 5px solid #ffebf0;
            box-sizing: border-box;
        }

        .screen.active {
            display: flex;
        }

        h1, h2 {
            color: #ff6b81;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(255, 107, 129, 0.2);
            font-size: 24px; /* 모바일 폰트 크기 약간 조정 */
        }

        .btn {
            background-color: #ff6b81;
            color: white;
            border: none;
            padding: 12px 24px; /* 모바일 맞춤 버튼 크기 조정 */
            font-size: 18px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin: 10px;
            box-shadow: 0 5px 10px rgba(255,107,129,0.2);
        }

        .btn:hover {
            background-color: #ff4757;
            transform: scale(1.05);
            box-shadow: 0 8px 15px rgba(255,107,129,0.3);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            position: relative;
            margin-top: 20px;
        }

        #btn-no {
            background-color: #a4b0be;
            position: relative;
            z-index: 10; /* 버튼이 다른 요소 위에 오도록 설정 */
        }

        .grid-menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .country-card {
            background: #fff;
            padding: 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid #f1f2f6;
            box-shadow: 0 5px 10px rgba(0,0,0,0.05);
            text-align: center;
            width: calc(50% - 20px); /* 모바일에서 2열로 깔끔하게 배치 */
            min-width: 120px;
            box-sizing: border-box;
        }

        .country-card:hover {
            border-color: #ff6b81;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255,107,129,0.15);
        }

        .country-thumbnail {
            width: 100%; /* 카드 너비에 꽉 차게 */
            aspect-ratio: 1/1; /* 정사각형 비율 유지 */
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .city-card {
            background: #f1f2f6;
            padding: 12px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            border: 2px solid transparent;
            width: calc(50% - 20px); /* 모바일에서 2열 배치 */
            min-width: 100px;
            text-align: center;
            box-sizing: border-box;
        }

        .city-card:hover {
            background: #ffebf0;
            border-color: #ff6b81;
            color: #ff6b81;
            transform: translateY(-3px);
        }

        .survey-group {
            text-align: left;
            width: 100%;
            margin-bottom: 20px;
        }
        
        .survey-group p {
            font-weight: bold;
            margin-bottom: 10px;
            color: #2f3542;
            font-size: 16px;
        }

        .radio-label {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            transition: background 0.2s;
            font-size: 15px; /* 모바일 글씨 크기 조정 */
        }
        
        .radio-label:hover {
            background: #ffeef2;
        }
        
        .back-btn {
            background-color: #a4b0be;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="screen1" class="screen active">
        <h1>✈️ 특별한 초대장</h1>
        <p style="font-size: 18px;">김종석과 여행을 가시겠습니까?</p>
        <div class="btn-group">
            <button class="btn" onclick="nextScreen(2)">예 💖</button>
            <button class="btn" id="btn-no">아니오</button>
        </div>
    </div>

    <div id="screen2" class="screen">
        <h2>어디로 떠나볼까? 🌎</h2>
        <p>원하는 나라를 하나 선택해 줘!</p>
        <div class="grid-menu" id="country-list"></div>
    </div>

    <div id="screen3" class="screen">
        <button class="back-btn" onclick="nextScreen(2)">◀ 뒤로가기</button>
        <h2 id="city-title">어느 도시가 좋아? 🏙️</h2>
        <div class="grid-menu" id="city-list"></div>
    </div>

    <div id="screen4" class="screen">
        <button class="back-btn" onclick="nextScreen(3)">◀ 뒤로가기</button>
        <h2>우리의 여행 스타일은? 📝</h2>
        
        <div class="survey-group">
            <p>1. 이번 여행의 핵심 목적은?</p>
            <label class="radio-label"><input type="radio" name="q1" value="관광"> 📸 유명한 명소는 다 가보는 관광 위주</label>
            <label class="radio-label"><input type="radio" name="q1" value="먹방"> 🍽️ 먹는 게 남는 거! 맛집 투어 먹방 위주</label>
            <label class="radio-label"><input type="radio" name="q1" value="쇼핑"> 🛍️ 캐리어 꽉꽉 채워오는 쇼핑 위주</label>
            <label class="radio-label"><input type="radio" name="q1" value="힐링"> 🌿 여유롭게 쉬고 오는 힐링 위주</label>
        </div>

        <div class="survey-group">
            <p>2. 우리의 아침 기상 스케줄은?</p>
            <label class="radio-label"><input type="radio" name="q2" value="늦잠"> ☕ 늦잠 푹 자고 느긋하게 출발</label>
            <label class="radio-label"><input type="radio" name="q2" value="일찍"> 🏃‍♂️ 아침 일찍부터 알차게 돌아다니기</label>
        </div>

        <div class="survey-group">
            <p>3. 가장 원하는 숙소 스타일은?</p>
            <label class="radio-label"><input type="radio" name="q3" value="가성비"> 🛏️ 잠만 자면 충분! 가성비와 위치 최고</label>
            <label class="radio-label"><input type="radio" name="q3" value="감성"> ✨ 막 찍어도 인생샷! 예쁜 감성 숙소</label>
            <label class="radio-label"><input type="radio" name="q3" value="호캉스"> 🏊‍♀️ 수영장과 조식 필수! 완벽한 호캉스</label>
        </div>

        <button class="btn" style="width: 100%; margin-top: 20px;" onclick="finishSurvey()">여행 계획 제출하기 💌</button>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        
        // 도망가는 로직을 함수로 분리 (마우스와 터치 모두 사용)
        function moveButton(e) {
            e.preventDefault(); // 모바일에서 터치 시 클릭되는 현상 방지
            this.style.position = 'fixed';
            
            // 버튼이 화면 밖으로 나가지 않도록 여백 설정
            const padding = 20;
            const maxX = window.innerWidth - this.offsetWidth - padding;
            const maxY = window.innerHeight - this.offsetHeight - padding;
            
            // 랜덤 좌표 생성 (최소 여백 보장)
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            
            this.style.left = randomX + 'px';
            this.style.top = randomY + 'px';
        }

        // PC(마우스) 환경 이벤트
        btnNo.addEventListener('mouseover', moveButton);
        // 모바일(터치) 환경 이벤트 추가
        btnNo.addEventListener('touchstart', moveButton);


        // 이미지 파일명 설정 유지
        const travelData = {
            '🇯🇵 일본': {
                img: '일본', 
                cities: ['도쿄', '오사카', '후쿠오카', '삿포로', '오키나와', '마쓰야마', '다카마쓰', '나고야']
            },
            '🇨🇳 중국': {
                img: '중국', 
                cities: ['베이징', '상하이', '칭다오', '장자제']
            },
            '🇻🇳 베트남': {
                img: '베트남', 
                cities: ['다낭', '나트랑', '하노이', '호치민', '푸꾸옥']
            },
            '🇹🇼 대만': {
                img: '대만', 
                cities: ['타이베이', '가오슝', '타이중']
            },
            '🇭🇰 홍콩': {
                img: '홍콩', 
                cities: ['홍콩섬', '구룡반도', '마카오(근교)']
            }
        };

        let chosenCountry = '';
        let chosenCity = '';

        function nextScreen(screenNumber) {
            // 스크롤 맨 위로 올리기 (모바일 환경 배려)
            window.scrollTo(0, 0);
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('screen' + screenNumber).classList.add('active');

            if (screenNumber === 2) {
                renderCountries();
            }
        }

        function renderCountries() {
            const countryList = document.getElementById('country-list');
            countryList.innerHTML = ''; 
            
            for (let country in travelData) {
                let card = document.createElement('div');
                card.className = 'country-card';
                card.onclick = () => selectCountry(country);

                let img = document.createElement('img');
                img.src = travelData[country].img;
                img.alt = country;
                img.className = 'country-thumbnail';
                card.appendChild(img);

                let name = document.createElement('p');
                name.innerText = country;
                name.style.margin = '0';
                name.style.fontWeight = 'bold';
                card.appendChild(name);

                countryList.appendChild(card);
            }
        }

        function selectCountry(country) {
            chosenCountry = country;
            const cityList = document.getElementById('city-list');
            document.getElementById('city-title').innerText = `${country}, 어디로 갈까? 🏙️`;
            cityList.innerHTML = ''; 

            travelData[country].cities.forEach(city => {
                let div = document.createElement('div');
                div.className = 'city-card';
                div.innerText = city;
                div.onclick = () => selectCity(city);
                cityList.appendChild(div);
            });

            nextScreen(3);
        }

        function selectCity(city) {
            chosenCity = city;
            nextScreen(4);
        }

        function finishSurvey() {
            const q1 = document.querySelector('input[name="q1"]:checked');
            const q2 = document.querySelector('input[name="q2"]:checked');
            const q3 = document.querySelector('input[name="q3"]:checked');

            if (!q1 || !q2 || !q3) {
                alert("선택 안 한 항목이 있어! 다 골라주면 좋겠어 😉");
                return;
            }

            const formData = {
                "선택한_나라": chosenCountry,
                "선택한_도시": chosenCity,
                "1_여행목적": q1.value,
                "2_기상시간": q2.value,
                "3_숙소취향": q3.value
            };

            const submitBtn = document.querySelector('#screen4 .btn');
            submitBtn.innerText = "전송 중... 💌";
            submitBtn.disabled = true;

            fetch("https://formspree.io/f/xvkpddgo", {
                method: "POST",
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            }).then(response => {
                if (response.ok) {
                    document.getElementById('screen4').innerHTML = `
                        <h1>🎉 접수 완료! 🎉</h1>
                        <p style="font-size: 18px;">우리의 여행 취향 분석 끝!<br>멋진 여행 코스를 짜서 올게 기대해❤️</p>
                        <div style="font-size: 60px; margin-top: 30px;">✈️💖🏝️</div>
                    `;
                } else {
                    alert("전송에 실패했어. 다시 시도해줄래?");
                    submitBtn.innerText = "여행 계획 제출하기 💌";
                    submitBtn.disabled = false;
                }
            }).catch(error => {
                alert("인터넷 연결을 확인해 줘!");
                submitBtn.innerText = "여행 계획 제출하기 💌";
                submitBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
